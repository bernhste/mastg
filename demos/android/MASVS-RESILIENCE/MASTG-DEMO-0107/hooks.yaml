metadata:
  name: "MASTG-DEMO-0107: Detecting Frida hooks and terminating the application on response"
  category: "RESILIENCE"
  platform: Android

hookCollection:
  - javaClass: javax.crypto.Cipher
    hooks:
      - method: doFinal
        overloads:
          - params:
              - [ "[B", input, { decoder: string } ]
            retType: { decoder: string }

