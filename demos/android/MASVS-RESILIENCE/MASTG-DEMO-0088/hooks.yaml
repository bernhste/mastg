metadata:
  name: "MASTG-DEMO-0088: Runtime Detection of Root Detection Mechanisms"
  category: "RESILIENCE"
  platform: Android

hookCollection:
  - javaClass: java.io.File
    hookSettings:
      callerFilter:
        - "org.owasp.mastestapp.MastgTest"
    hooks:
      - method: $init
        overloads:
          - params:
              - [ java.lang.String, pathname ]
  - javaClass: java.lang.Runtime
    hookSettings:
      callerFilter:
        - "org.owasp.mastestapp.MastgTest"
    hooks:
      - method: exec
        overloads:
          - params:
              - [ "[Ljava.lang.String;", cmdarray ]
          - params:
              - [ java.lang.String, command ]

