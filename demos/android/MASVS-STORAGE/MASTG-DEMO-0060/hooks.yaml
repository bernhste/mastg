metadata:
  name: "MASTG-DEMO-0060: EncryptedSharedPreferences Sensitive Data Storage"
  category: "STORAGE"
  platform: Android

hookCollection:
  - javaClass: androidx.security.crypto.EncryptedSharedPreferences$Editor
    hooks:
      - method: putString
        overloads:
          - params:
              - [ java.lang.String, key ]
              - [ java.lang.String, value ]
      - method: putStringSet
        overloads:
          - params:
              - [ java.lang.String, key ]
              - [ java.util.Set, values ]
  - javaClass: android.app.SharedPreferencesImpl$EditorImpl
    hooks:
      - method: putString
        overloads:
          - params:
              - [ java.lang.String, key ]
              - [ java.lang.String, value ]
      - method: putStringSet
        overloads:
          - params:
              - [ java.lang.String, key ]
              - [ java.util.Set, values ]
