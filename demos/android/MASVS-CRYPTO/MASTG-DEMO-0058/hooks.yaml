metadata:
  name: "MASTG-DEMO-0058: Using KeyGenParameterSpec with a Broken ECB Block Mode"
  category: "CRYPTO"
  platform: Android

hookCollection:
  - javaClass: android.security.keystore.KeyGenParameterSpec$Builder
    hooks:
      - method: setBlockModes
        overloads:
          - params:
              - [ "[Ljava.lang.String;", blockModes ]
      - method: setRandomizedEncryptionRequired
        overloads:
          - params:
              - [ boolean, randomizedEncryptionRequired ]
  - javaClass: android.security.keystore.KeyProtection$Builder
    hooks:
      - method: setBlockModes
        overloads:
          - params:
              - [ "[Ljava.lang.String;", blockModes ]
      - method: setRandomizedEncryptionRequired
        overloads:
          - params:
              - [ boolean, randomizedEncryptionRequired ]
